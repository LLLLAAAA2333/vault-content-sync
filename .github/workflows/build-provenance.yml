name: Build and attest install files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@10.17.0
          pnpm install --frozen-lockfile
      - name: Check, build and test
        run: |
          pnpm check:release
          pnpm test
          pnpm demo
      - name: Select Obsidian install files
        run: |
          mkdir install-files
          cp dist/vault-content-sync/main.js dist/vault-content-sync/manifest.json dist/vault-content-sync/styles.css install-files/
          sha256sum install-files/*
      - name: Attest the actual build output
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: install-files/*
      - name: Keep files for comparison and manual release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: obsidian-install-files
          path: install-files/*
          if-no-files-found: error
          retention-days: 14
